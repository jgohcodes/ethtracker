[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethtracker"
version = "0.1.0"
description = "ETH-USD tracker with leveraged position sizing and a risk journal"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "requests", "cryptography"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ethtracker = "ethtracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
