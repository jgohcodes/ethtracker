name: Dashboard

# Refreshes the Vercel dashboard every hour at :17, from live Coinbase daily candles (signals use completed
# daily candles only, so they change once a day, after the 00:00 UTC close), Deribit open interest and
# funding, and your Coinbase position: hourly runs date each trade worked out from the position to within the
# hour. GitHub may start scheduled runs late or drop one under load. Run it by hand from the Actions tab too.
#
# Needs two repository secrets: ETHTRACKER_DASHBOARD_URL and ETHTRACKER_INGEST_TOKEN. Without them it
# does a dry run: live data, computed, nothing published.
#
# This repository is public, so these logs are public: cloud-run prints market facts and counts only,
# never equity, sizes or positions.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      study:
        description: "Also run the studies on the full daily history"
        type: boolean
        default: false
      studies:
        description: "Which studies: all, or a list from signals, backtest, cycle, combo, short, swing, trim, pullbacks, timing, entry, score, dips, caps, account"
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ETHTRACKER_HOME: ${{ github.workspace }}/.ethtracker-run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet .
      - name: Compute and publish
        env:
          ETHTRACKER_DASHBOARD_URL: ${{ secrets.ETHTRACKER_DASHBOARD_URL }}
          ETHTRACKER_INGEST_TOKEN: ${{ secrets.ETHTRACKER_INGEST_TOKEN }}
          COINBASE_API_KEY_JSON: ${{ secrets.COINBASE_API_KEY_JSON }}
          COINBASE_API_KEY_ID: ${{ secrets.COINBASE_API_KEY_ID }}
        run: |
          if [ -n "$ETHTRACKER_DASHBOARD_URL" ] && [ -n "$ETHTRACKER_INGEST_TOKEN" ]; then
            ethtracker cloud-run
          else
            echo "::notice title=Dry run::Set the ETHTRACKER_DASHBOARD_URL and ETHTRACKER_INGEST_TOKEN repository secrets to publish. This run fetched live data and published nothing."
            ethtracker cloud-run --dry-run
          fi
      # Which Coinbase endpoints the view-only key can read: statuses, field names and yes/no only, never values.
      - name: Account check
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'account')) }}
        continue-on-error: true
        env:
          COINBASE_API_KEY_JSON: ${{ secrets.COINBASE_API_KEY_JSON }}
          COINBASE_API_KEY_ID: ${{ secrets.COINBASE_API_KEY_ID }}
        run: ethtracker account-check
      # The dashboard's market panels as text, from live data: market facts only, never the plan's floor.
      - name: Market context
        run: |
          ethtracker context
          echo
          ethtracker signals --days 1000
      - name: Signals study
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'signals')) }}
        run: ethtracker signals-study --days 3000
      # The entry rule itself: a 20% pullback from the 30-day high, 3x ATR stop, 14-day time stop.
      # At 10x isolated the liquidation price sits inside that stop; ~2.5x is what the 40% stress rule allows.
      - name: Pullback backtest
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'backtest')) }}
        run: |
          for lev in 10 2.5; do
            echo "::group::20% pullback, ${lev}x"
            ethtracker study --days 3000 --trigger 20 --stop-atr 3 --leverage "$lev"
            echo "::endgroup::"
          done
          echo "::group::15% pullback, 2.5x"
          ethtracker study --days 3000 --trigger 15 --stop-atr 3 --leverage 2.5
          echo "::endgroup::"
      # Dip-buying with leverage versus holding spot, inside each bull phase of the 4-year cycle and overall.
      - name: Cycle study
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'cycle')) }}
        run: ethtracker cycle-study --days 4000
      # A long-only perp core plus a small high-leverage swing sleeve feeding it, versus spot.
      - name: Two-sleeve study
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'combo')) }}
        run: ethtracker combo-study --days 4000
      # Short-term shorts on overheating signals (incl. Deribit's funding history), alone and as a cut to the core.
      - name: Short study
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'short')) }}
        run: ethtracker short-study --days 4000
      # Buy a sharp pullback, sell only into a spike: on ETH and on BTC.
      - name: Swing study, ETH
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'swing')) }}
        run: ethtracker swing-study --asset ETH --days 4000
      - name: Swing study, BTC
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'swing')) }}
        run: ethtracker swing-study --asset BTC --days 4000
      # Trim into spikes, refill on dips, with the liquidation price pinned where it started.
      - name: Trim study, ETH
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'trim')) }}
        run: ethtracker trim-study --asset ETH --days 4000
      - name: Trim study, BTC
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'trim')) }}
        run: ethtracker trim-study --asset BTC --days 4000
      # How often "the pullback is over" signals were right, buy orders under the price, and adding every week.
      - name: Pullback study, ETH
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'pullbacks')) }}
        run: ethtracker pullback-study --asset ETH --days 4000
      - name: Pullback study, BTC
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'pullbacks')) }}
        run: ethtracker pullback-study --asset BTC --days 4000
      # Adding cash every week or saving it for 20% dips, at 1x, 2.5x, 3x and under the floor plan.
      - name: Dip study, ETH
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'dips')) }}
        run: |
          ethtracker dip-study --asset ETH --days 4000
          echo
          ethtracker dip-study --asset ETH --days 4000 --years 2 --since 2021-01-01
      # The floor plan with new cash's leverage capped: fixed at 3x, or set by the signal score.
      - name: Cap study, ETH
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'caps')) }}
        run: |
          ethtracker cap-study --asset ETH --days 4000
          echo
          ethtracker cap-study --asset ETH --days 4000 --years 2 --since 2021-01-01
      # The signal score: each part's direction and each score bucket against what followed, before and from 2021.
      - name: Score study, ETH
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'score')) }}
        run: ethtracker score-study --asset ETH --days 4000
      - name: Level study, ETH
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'levels')) }}
        run: ethtracker level-study --asset ETH --days 4000
      # Putting cash to work now or bidding lower, when each buy is sized to a liquidation floor.
      - name: Entry study, ETH
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'entry')) }}
        run: ethtracker entry-study --asset ETH --days 4000
      # Buying weekly but picking the day within a few days, and how often price broke a floor under the start.
      - name: Timing study, ETH
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'timing')) }}
        run: ethtracker timing-study --asset ETH --days 4000 --floor 1300
      - name: Timing study, BTC
        if: ${{ inputs.study && (inputs.studies == 'all' || contains(inputs.studies, 'timing')) }}
        run: ethtracker timing-study --asset BTC --days 4000
